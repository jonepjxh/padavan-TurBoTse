name: Build B70 hanwckf OC1000

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-b70-hw.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout overlay
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
          cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget bc rsync libssl-dev

    - name: Clone hanwckf-based source and toolchain
      run: |
        git clone --depth=1 https://github.com/only-wl/padavan-4.4.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh

    - name: Configure HC5962 with OC 1000MHz
      run: |
        cd /opt/rt-n56u/trunk
        cp -f configs/templates/HC5962.config .config
        sed -i 's/# CONFIG_MT7621_OC is not set/CONFIG_MT7621_OC=y/' configs/boards/HC5962/kernel-4.4.x.config
        echo 'CONFIG_FIRMWARE_INCLUDE_OC=y' >> .config
        echo '--- board kernel config check ---'
        grep -E 'CONFIG_MT7621_(OC|CPU_FREQ)' configs/boards/HC5962/kernel-4.4.x.config
        grep -q 'CONFIG_MT7621_OC=y' configs/boards/HC5962/kernel-4.4.x.config
        grep -q 'CONFIG_MT7621_CPU_FREQ="0x312"' configs/boards/HC5962/kernel-4.4.x.config

    - name: Build firmware
      run: |
        cd /opt/rt-n56u/trunk
        sudo ./clear_tree
        sudo ./build_firmware_modify HC5962 0
        ls -l images/

    - name: Verify OC in kernel config
      run: |
        grep -E '^CONFIG_MT7621_' /opt/rt-n56u/trunk/linux-4.4.x/.config || true
        grep -q '^CONFIG_MT7621_OC=y' /opt/rt-n56u/trunk/linux-4.4.x/.config

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: B70-hw-oc1000
        path: /opt/rt-n56u/trunk/images/*.trx
        if-no-files-found: error
