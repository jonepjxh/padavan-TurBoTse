name: Build B70 only-wl IPv6+PluginCenter

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-b70-owl.yml'
      - 'owl-overlay.tar.gz'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout overlay repo
      uses: actions/checkout@v4

    - name: Init environment
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
          cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget bc rsync libssl-dev

    - name: Clone only-wl source and toolchain
      run: |
        git clone --depth=1 https://github.com/only-wl/padavan-4.4.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh

    - name: Apply IPv6 fix + plugin center overlay
      run: |
        tar -xzf owl-overlay.tar.gz -C /opt/rt-n56u
        cd /opt/rt-n56u
        chmod +x trunk/user/scripts/pluginctl
        python3 owl_patch.py
        echo "--- 补丁后自检 ---"
        grep -n '"ip6_lan_auto"' trunk/user/shared/defaults.c
        grep -n 'reload_nat_modules();' trunk/user/rc/net6.c | head -3
        grep -n 'plugin_center' trunk/user/httpd/web_ex.c
        grep -n 'CONFIG_FIRMWARE_ENABLE_IPV6' trunk/configs/templates/HC5962.config
        ls -l trunk/user/httpd/plugin_center.c
        grep -n 'plugin_detail\|plugin_webui' trunk/user/httpd/web_ex.c
        grep -n 'do_js' trunk/user/httpd/web_ex.c
        if grep -q 'menu5_30' trunk/user/www/n56u_ribbon_fixed/state.js; then echo "穿透服务菜单未移除"; exit 1; fi
        if grep -q 'Advanced_wireguard.asp' trunk/user/www/n56u_ribbon_fixed/state.js; then echo "wireguard 页面仍挂菜单"; exit 1; fi
        ls -l owl-musl/
        grep -n 'owl-musl/ld-musl-mipsel.so.1' trunk/Makefile
        grep -n 'ensure_optbin\|relink_plugin' trunk/user/scripts/pluginctl | head -5

    - name: Configure HC5962 with OC 1000MHz
      run: |
        cd /opt/rt-n56u/trunk
        cp -f configs/templates/HC5962.config .config
        sed -i 's/# CONFIG_MT7621_OC is not set/CONFIG_MT7621_OC=y/' configs/boards/HC5962/kernel-4.4.x.config
        echo 'CONFIG_FIRMWARE_INCLUDE_OC=y' >> .config
        grep -E 'CONFIG_MT7621_(OC|CPU_FREQ)' configs/boards/HC5962/kernel-4.4.x.config
        grep -q 'CONFIG_MT7621_OC=y' configs/boards/HC5962/kernel-4.4.x.config
        grep -q 'CONFIG_MT7621_CPU_FREQ="0x312"' configs/boards/HC5962/kernel-4.4.x.config

    - name: Build firmware
      run: |
        cd /opt/rt-n56u/trunk
        sudo ./clear_tree
        sudo ./build_firmware_modify HC5962 0
        ls -l images/ || true

    - name: Verify OC + payload
      run: |
        grep -q '^CONFIG_MT7621_OC=y' /opt/rt-n56u/trunk/linux-4.4.x/.config
        ls -l /opt/rt-n56u/trunk/romfs/www/Advanced_IPv6_Content.asp
        ls -l /opt/rt-n56u/trunk/romfs/www/Advanced_plugincenter.asp
        ls -l /opt/rt-n56u/trunk/romfs/usr/bin/pluginctl
        test -x /opt/rt-n56u/trunk/romfs/usr/bin/pluginctl
        ls -l /opt/rt-n56u/trunk/romfs/lib/ld-musl-mipsel.so.1
        ls -l /opt/rt-n56u/trunk/romfs/lib/libc.so
        test -s /opt/rt-n56u/trunk/romfs/lib/ld-musl-mipsel.so.1

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: B70-owl-ipv6-plugincenter-oc1000
        path: /opt/rt-n56u/trunk/images/*.trx
        if-no-files-found: error
