name: Build B70 (HC5962) with Plugin Center + OC

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build B70 (mipsel-linux-musl, OC 1000MHz)
    runs-on: ubuntu-24.04
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbo-b70-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils \
            autopoint gettext ccache autoconf automake liblzma-dev \
            libltdl-dev liblzo2-dev curl xz-utils build-essential jq

      - name: Download upstream source
        run: |
          curl -fL --retry 3 -o padavan.tar.gz \
            https://codeload.github.com/TurBoTse/padavan/tar.gz/refs/heads/main
          mkdir -p src
          tar -xzf padavan.tar.gz -C src --strip-components=1

      - name: Apply Plugin Center overlay + Plugin WebUI
        run: |
          curl -fL --retry 3 -o pc-webui-overlay.tar.gz \
            "https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugin-webui-overlay.tar.gz"
          tar -xzf pc-webui-overlay.tar.gz -C src
          curl -fL --retry 3 -o pc-overlay.tar.gz \
            "https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugincenter-overlay.tar.gz"
          tar -xzf pc-overlay.tar.gz -C src
          echo "Plugin Center overlay applied."

      - name: Seed udns source (upstream mirrors are dead)
        run: |
          mkdir -p src/trunk/download
          curl -fL --retry 3 -o src/trunk/download/udns-0.6.tar.gz \
            https://deb.debian.org/debian/pool/main/u/udns/udns_0.6.orig.tar.gz
          echo "696a2d0d518da985d975a65e11d166f3f57cdbd1d42376a0b85307f49601c6e8  src/trunk/download/udns-0.6.tar.gz" | sha256sum -c -

      - name: Patch B70 (overclock 1000MHz + wireless defaults)
        working-directory: src
        run: |
          CFG=trunk/configs/templates/B70.config
          # 1) 打开 CPU 超频开关（B70 模板默认 INCLUDE_OC=n，OC 值 0x312 已被注释但未生效）
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OC=n$/CONFIG_FIRMWARE_INCLUDE_OC=y/' $CFG
          sed -i 's/^CONFIG_FIRMWARE_MT7621_OC=.*$/CONFIG_FIRMWARE_MT7621_OC="0x312"/' $CFG
          # configure 只会在 CONFIG_RALINK_MT7621=y 后面追加一行；板级 kernel config 里原有的
          # "# CONFIG_MT7621_OC is not set" 在 kconfig 里更靠后，会覆盖回去（build 20261126 实测内核里没有 0x312 字符串）。
          # 这里直接把板级 kernel config 改成 y，保证最终 .config 生效。
          KCFG=trunk/configs/boards/B70/kernel-4.4.x.config
          sed -i 's|^# CONFIG_MT7621_OC is not set$|CONFIG_MT7621_OC=y|' $KCFG
          grep -nE '^CONFIG_MT7621_OC|^CONFIG_MT7621_CPU_FREQ' $KCFG
          # NFS 服务/客户端与本构建环境的主机 rpc 头文件冲突（nfs-utils configure 失败），默认关闭
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_NFSD=.*$/CONFIG_FIRMWARE_INCLUDE_NFSD=n/' $CFG
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_NFSC=.*$/CONFIG_FIRMWARE_INCLUDE_NFSC=n/' $CFG
          grep -E 'CONFIG_FIRMWARE_(INCLUDE_OC|MT7621_OC)' $CFG

          # 2) 无线默认参数优化（两块射频：MT7603E 2.4G + MT7612E 5G）
          python3 - <<'PY'
          p = 'trunk/user/shared/src/defaults.c'
          s = open(p, encoding='utf-8').read()
          sub = [
            # 5G (MT7612E) 打开 STBC：空旷/远距离场景下接收端分集增益约 2~3dB
            ('{ "wl_stbc", "0" },', '{ "wl_stbc", "1" },'),
            # 2.4G (MT7603E) 打开 LDPC：弱信号下编码增益约 1~2dB
            ('{ "rt_ldpc", "0" },', '{ "rt_ldpc", "1" },'),
            # 5G 默认固定 149 信道（非 DFS、可用功率上限更高，避免默认落进 52~64 DFS 段被限功率）
            ('{ "wl_channel", "0" },', '{ "wl_channel", "149" },'),
          ]
          for a, b in sub:
              n = s.count(a)
              print(f'patch {a!r} -> {b!r} : {n} hit(s)')
              assert n == 1, 'unexpected match count'
              s = s.replace(a, b)
          open(p, 'w', encoding='utf-8').write(s)
          print('defaults.c patched')
          PY
          grep -nE '"wl_stbc"|"rt_ldpc"|"wl_channel"|"wl_TxPower"|"rt_TxPower"' trunk/user/shared/src/defaults.c

      - name: Build firmware
        working-directory: src
        run: make B70 TOOLCHAIN=mipsel-linux-musl

      - name: Verify OC in kernel config
        working-directory: src
        run: |
          KCFG=trunk/linux-4.4.x/.config
          grep -nE '^CONFIG_MT7621_OC|^CONFIG_MT7621_CPU_FREQ' $KCFG || true
          grep -q '^CONFIG_MT7621_OC=y' $KCFG && echo "OC enabled in kernel .config" || (echo "OC NOT enabled"; exit 1)

      - name: Collect firmware
        run: |
          mkdir -p output
          ls -lh src/trunk/images/
          SRC=$(ls src/trunk/images/*.trx | head -1)
          cp "$SRC" "output/TurBoTse-B70-4.4-oc1000-plugincenter-${{ env.BUILD_DATE }}.trx"
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: padavan-B70-oc1000-plugincenter-${{ env.BUILD_DATE }}
          path: output/*.trx
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: padavan-b70-oc1000-plugincenter-${{ env.BUILD_DATE }}
          name: Padavan B70 (HC5962) 超频1000MHz + 插件中心 ${{ env.BUILD_DATE }}
          body: |
            极路由4 / HC5962 (B70) 固件：MT7621 双核超频至 1000MHz（0x312），无线默认参数优化（5G STBC、2.4G LDPC、5G 固定 149 非 DFS 信道、TxPower 100）。
            内置「高级设置 → 系统 → 插件中心」，可在线安装插件包（插件仓库 tag: plugin-repo）。
            Target B70, toolchain mipsel-linux-musl, source TurBoTse/padavan main.
          files: output/*.trx
