name: Build K2P Lite with Plugin Center

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build K2P Lite + Plugin Center (mipsel-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbo-k2p-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils \
            autopoint gettext ccache autoconf automake liblzma-dev \
            libltdl-dev liblzo2-dev curl xz-utils build-essential jq

      - name: Download upstream source
        run: |
          curl -fL --retry 3 -o padavan.tar.gz \
            https://codeload.github.com/TurBoTse/padavan/tar.gz/refs/heads/main
          mkdir -p src
          tar -xzf padavan.tar.gz -C src --strip-components=1

      - name: Apply Plugin Center overlay
        run: |
          # 上游 tarball 里没有插件中心，这里覆盖上本仓库的实现：
          #   web_ex.c（state.js 菜单注入）、pluginctl（安装器）、
          #   Advanced_plugincenter/plugincat/plugincfg.asp、CN.dict。
          # ?v=${GITHUB_RUN_ID} 用于穿透 raw.githubusercontent 的 CDN 缓存，
          # 否则可能拿到上一次构建时的旧 overlay。
          curl -fL --retry 3 -o pc-overlay.tar.gz \
            "https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugincenter-overlay.tar.gz?v=${GITHUB_RUN_ID}"
          tar -tzf pc-overlay.tar.gz
          tar -xzf pc-overlay.tar.gz -C src
          echo "Plugin Center overlay applied."

      - name: Seed udns source (upstream mirrors are dead)
        run: |
          mkdir -p src/trunk/download
          curl -fL --retry 3 -o src/trunk/download/udns-0.6.tar.gz \
            https://deb.debian.org/debian/pool/main/u/udns/udns_0.6.orig.tar.gz
          echo "696a2d0d518da985d975a65e11d166f3f57cdbd1d42376a0b85307f49601c6e8  src/trunk/download/udns-0.6.tar.gz" | sha256sum -c -

      - name: Apply lite baseline (all swappable plugins off)
        working-directory: src
        run: |
          CONFIGFILE=trunk/configs/templates/K2P.config
          ALL_PLUGINS=(VLMCSD MSD_LITE HTOP SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS \
            SINGBOX NAIVEPROXY REDSOCKS SMARTDNS ADGUARDHOME DNSFORWARDER \
            TRANSMISSION TRANSMISSION_WEB_CONTROL ARIA ARIA_WEB_CONTROL \
            SMBD FTPD MINIDLNA FIREFLY XUPNPD NTFS_3G RPL2TP \
            OPENVPN SSWAN ZEROTIER WIREGUARD FRPC FRPS SOFTETHERVPN_SERVER \
            SOFTETHERVPN_CLIENT SOFTETHERVPN_CMD TTYD IPERF3 MTR SOCAT \
            SRELAY DUMP1090 RTL_SDR SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP \
            NJIT_CLIENT DDNSTO ALIDDNS SQM HTTPS SFTP OPENSSH)
          for m in "${ALL_PLUGINS[@]}"; do
            echo "CONFIG_FIRMWARE_INCLUDE_${m}=n" >> "$CONFIGFILE"
          done
          # Lite baseline: no NanoAd / ad-filter slot.
          echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=n" >> "$CONFIGFILE"
          echo "--- enabled plugins in lite baseline ---"
          grep 'CONFIG_FIRMWARE_INCLUDE_.*=y' "$CONFIGFILE" | grep -v '^#'

      - name: Build firmware
        working-directory: src
        run: make K2P TOOLCHAIN=mipsel-linux-musl

      - name: Collect firmware
        run: |
          mkdir -p output
          ls -lh src/trunk/images/
          SRC=$(ls src/trunk/images/*.trx | head -1)
          cp "$SRC" "output/TurBoTse-K2P-4.4-lite-plugincenter-${{ env.BUILD_DATE }}.trx"
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: padavan-K2P-lite-plugincenter-${{ env.BUILD_DATE }}
          path: output/*.trx
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: padavan-k2p-lite-plugincenter-${{ env.BUILD_DATE }}
          name: Padavan K2P 精简版+插件管理 ${{ env.BUILD_DATE }}
          body: |
            精简版固件（lite 基线，不含 NanoAd / 任何预置插件），内置「高级设置 → 系统 → 插件中心」。
            可在线下载安装插件包（插件仓库 tag: plugin-repo，jonepjxh/padavan-TurBoTse）。带 webui.conf 的插件可在「高级设置 → 系统 → 插件设置」里设置参数。
            Target K2P, toolchain mipsel-linux-musl, source TurBoTse/padavan main.
          files: output/*.trx
