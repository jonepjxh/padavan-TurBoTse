name: Build Plugin Repository (all plugins)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Compile all plugins and publish repo
    runs-on: ubuntu-24.04
    steps:
      - name: Set build date
        run: echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbo-k2p-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils \
            autopoint gettext ccache autoconf automake liblzma-dev \
            libltdl-dev liblzo2-dev curl xz-utils build-essential jq fakeroot \
            cmake nodejs npm unzip zlib1g-dev libssl-dev

      - name: Download upstream source
        run: |
          curl -fL --retry 3 -o padavan.tar.gz \
            https://codeload.github.com/TurBoTse/padavan/tar.gz/refs/heads/main
          mkdir -p src
          tar -xzf padavan.tar.gz -C src --strip-components=1

      - name: Seed udns source
        run: |
          mkdir -p src/trunk/download
          curl -fL --retry 3 -o src/trunk/download/udns-0.6.tar.gz \
            https://deb.debian.org/debian/pool/main/u/udns/udns_0.6.orig.tar.gz
          echo "696a2d0d518da985d975a65e11d166f3f57cdbd1d42376a0b85307f49601c6e8  src/trunk/download/udns-0.6.tar.gz" | sha256sum -c -

      - name: Fetch NanoAd source (password-free build)
        run: |
          curl -fL --retry 3 -o nanoad-inject.tar.gz \
            https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/nanoad-inject.tar.gz
          mkdir -p src/nanoad-src
          tar -xzf nanoad-inject.tar.gz -C src/nanoad-src --strip-components=3 trunk/user/adbyby
          echo "NanoAd source ready at src/nanoad-src"
          ls src/nanoad-src/src

      - name: Fetch plugin packaging assets
        run: |
          BASE=https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugin-build
          curl -fL --retry 3 -o src/build_extra_plugins.py "$BASE/build_extra_plugins.py?v=2"
          grep -q "os.path.join(SRC, 'plugin_patch')" src/build_extra_plugins.py || { echo "WARN: stale builder cached, retry with API"; sleep 5; curl -fL --retry 3 -o src/build_extra_plugins.py "$BASE/build_extra_plugins.py?v=3"; }
          mkdir -p src/plugin_patch/nanoad src/plugin_patch/adbyby
          for kind in nanoad adbyby; do
            for f in install.sh start.sh stop.sh; do
              curl -fL --retry 3 -o "src/plugin_patch/$kind/$f" "$BASE/$kind/$f"
            done
          done
          echo "packaging assets ready"

      - name: Enable all plugins in config
        working-directory: src
        run: |
          CFG=trunk/configs/templates/K2P.config
          # Pure-userspace plugins only (no kernel-module-dependent ones).
          # These compile as standalone binaries and can run when installed
          # on the lite firmware via the plugin center.
          for m in \
            HTOP NANO IPERF3 TTYD SOCAT MTR LRZSZ TCPDUMP CURL \
            SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS \
            REDSOCKS MICROSOCKS SRELAY 3PROXY \
            SMARTDNS ALIDDNS DDNSTO DNSFORWARDER ADGUARDHOME \
            FRPC FRPS \
            MSD_LITE VLMCSD MENTOHUST U2EC \
            SCUTCLIENT DOGCOM GDUT_DRCOM MINIEAP NJIT_CLIENT \
            XUPNPD ALDRIVER; do
            echo "CONFIG_FIRMWARE_INCLUDE_${m}=y" >> "$CFG"
          done
          echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=y" >> "$CFG"
          # sing-box / naiveproxy / resolveip hang off SHADOWSOCKS=y
          echo "CONFIG_FIRMWARE_INCLUDE_SINGBOX=y" >> "$CFG"
          echo "CONFIG_FIRMWARE_INCLUDE_NAIVEPROXY=y" >> "$CFG"
          # wireguard-tools (wg binary). Kernel module is firmware-side only.
          echo "CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y" >> "$CFG"
          # ZeroTier user-space daemon.
          echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> "$CFG"
          # Storage-dependent download/media servers. Need USB + a filesystem
          # so that STORAGE_ENABLED is set in trunk/user/Makefile.
          echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> "$CFG"
          echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> "$CFG"
          echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> "$CFG"
          # STORAGE_ENABLED (trunk/user/Makefile) requires kernel CONFIG_BLK_DEV_SD,
          # and u2ec requires CONFIG_USB_SUPPORT. K2P-USB board kernel config has
          # all of those; swap it in while keeping the K2P board itself.
          KCFG=trunk/configs/boards/K2P/kernel-4.4.x.config
          UKCFG=trunk/configs/boards/K2P-USB/kernel-4.4.x.config
          if [ -f "$UKCFG" ]; then
            cp -f "$UKCFG" "$KCFG"
            echo "swapped in K2P-USB kernel config for storage plugins"
          fi
          for m in ARIA TRANSMISSION MINIDLNA FIREFLY FTPD; do
            echo "CONFIG_FIRMWARE_INCLUDE_${m}=y" >> "$CFG"
          done
          echo "CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=y" >> "$CFG"
          echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL=y" >> "$CFG"
          echo "--- enabled count ---"
          grep -c 'CONFIG_FIRMWARE_INCLUDE_.*=y' "$CFG"

      - name: Fix upstream plugin Makefiles
        working-directory: src
        run: |
          # ZeroTier upstream Makefile has its compile line commented out and
          # installs the source DIR as the binary. Restore real build + path.
          ZM=trunk/user/zerotier/Makefile
          # Upstream zerotier dir ships no patch files but Makefile applies two.
          # They are ARM-only; on MIPS we drop the patch lines and keep the build.
          sed -i '/0007-add-cerrno-header-for-str-errno/d; /0008-fix-compilation-for-arm_cortex-a7-neon/d' "$ZM" 2>/dev/null || true
          # libav 0.6 calls `ld -shared -Wl,-soname,...` (gcc-style arg to bare ld)
          # which mipsel bfd ld rejects. Force static lib build to skip that path.
          LAVM=trunk/libs/libav/Makefile
          if [ -f "$LAVM" ]; then
            sed -i '/^include .*package.mk/a LIBS_BUILD_SHARED:=n' "$LAVM"
            echo "--- libav Makefile shared override ---"
            grep -n 'LIBS_BUILD_SHARED' "$LAVM"
          fi
          if [ -f "$ZM" ]; then
            sed -i 's/^#all: download_test extract_test/all: download_test extract_test/' "$ZM"
            sed -i 's|^#[[:space:]]*$(MAKE) -j$(HOST_NCPU) -C $(SRC_NAME)[[:space:]]*$|	$(MAKE) -j$(HOST_NCPU) -C $(SRC_NAME) LDFLAGS="-static-libstdc++ -latomic"|' "$ZM"
            # Correct romfs install: source dir -> compiled binary
            sed -i 's|$(THISDIR)/$(SRC_NAME) /usr/bin/zerotier-one|$(THISDIR)/$(SRC_NAME)/zerotier-one /usr/bin/zerotier-one|' "$ZM"
            echo "--- zerotier Makefile all/romfs ---"
            grep -A2 -E '^(all:|romfs:)' "$ZM"
          fi

      - name: Build firmware
        working-directory: src
        run: |
          # -k keeps going when an individual optional plugin fails, so one
          # bad plugin does not prevent all the others from being packaged.
          # zerotier needs libatomic for 64-bit __atomic_* on MIPS.
          export LDFLAGS="${LDFLAGS:-} -latomic"
          make -k K2P TOOLCHAIN=mipsel-linux-musl || echo "make returned nonzero (some plugins may have failed); continuing to package what was built"

      - name: Inspect romfs and link types
        working-directory: src
        run: |
          echo "=== romfs top dirs ==="
          find trunk/romfs -maxdepth 2 -type d | sort | head -60
          echo "=== sample bin link types ==="
          for b in htop nano iperf3 ttyd socat mtr xray sing-box frpc smartdns; do
            f=$(find trunk/romfs -name "$b" -type f 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              printf '%-12s ' "$b"
              file "$f" | sed 's/.*: //'
            fi
          done
          echo "=== shared libs present ==="
          find trunk/romfs -name '*.so*' -type f | head -40
          echo "=== total romfs size ==="
          du -sh trunk/romfs

      - name: Package plugins
        working-directory: src
        run: |
          set -e
          ROOT=$PWD
          PKGDIR=$ROOT/plugin-repo
          mkdir -p "$PKGDIR"
          # Each plugin: name|space-separated relative paths under romfs
          # Paths are matched with find; multiple matches allowed.
          cat > /tmp/plugin_map.txt <<'MAP'
          htop|usr/bin/htop
          nano|usr/bin/nano
          iperf3|usr/bin/iperf3
          ttyd|usr/bin/ttyd
          socat|usr/bin/socat
          mtr|usr/bin/mtr
          lrzsz|usr/bin/lrz usr/bin/sz usr/bin/rz
          tcpdump|usr/bin/tcpdump
          shadowsocks|usr/bin/ss-local usr/bin/ss-redir usr/bin/ss-server
          xray|usr/bin/xray
          v2ray|usr/bin/v2ray
          trojan|usr/bin/trojan
          ssobfs|usr/bin/obfs-local usr/bin/obfs-server
          singbox|usr/bin/sing-box
          naiveproxy|usr/bin/naive
          redsocks|usr/bin/redsocks
          microsocks|usr/bin/microsocks
          smartdns|usr/bin/smartdns
          adguardhome|usr/bin/AdGuardHome
          aliddns|usr/bin/aliddns.sh
          ddnsto|usr/bin/ddnsto
          aldriver|usr/bin/aliyundrive-webdav
          frp|usr/bin/frpc usr/bin/frps
          aria2|usr/bin/aria2c
          transmission|usr/bin/transmission-daemon
          minidlna|usr/bin/minidlnad
          firefly|usr/bin/mt-daapd
          xupnpd|usr/bin/xupnpd
          vsftpd|usr/sbin/vsftpd
          dump1090|usr/bin/dump1090
          msd_lite|usr/bin/msd_lite
          vlmcsd|usr/bin/vlmcsd
          mentohust|usr/bin/bin_mentohust
          u2ec|usr/bin/u2ec
          scutclient|usr/bin/bin_scutclient
          dogcom|usr/bin/dogcom
          gdut_drcom|usr/bin/gdut-drcom
          minieap|usr/bin/minieap
          srelay|usr/bin/srelay
          chinadns_ng|usr/bin/chinadns-ng
          dns2tcp|usr/bin/dns2tcp
          dnsproxy|usr/bin/dnsproxy
          ipt2socks|usr/bin/ipt2socks
          3proxy|usr/bin/3proxy
          dnsforwarder|usr/bin/dns-forwarder
          wireguard|usr/bin/wg
          zerotier|usr/bin/zerotier-one
          inadyn|usr/sbin/inadyn
          dnsmasq|usr/sbin/dnsmasq
          lldt|usr/bin/lld2d
          resolveip|usr/bin/resolveip
          MAP
          python3 - <<'PY'
          import os, json, hashlib, tarfile, fnmatch
          root = os.getcwd()
          romfs = os.path.join(root, 'trunk', 'romfs')
          pkgdir = os.path.join(root, 'plugin-repo')
          fancy = {
            'htop':'系统监控','nano':'终端编辑器','iperf3':'网络测速','ttyd':'网页终端',
            'socat':'网络工具','mtr':'路由追踪','lrzsz':'ZMODEM传输','tcpdump':'抓包工具',
            'shadowsocks':'Shadowsocks','xray':'Xray','v2ray':'V2Ray','trojan':'Trojan',
            'ssobfs':'simple-obfs','singbox':'Sing-box','naiveproxy':'NaiveProxy',
            'redsocks':'Redsocks','microsocks':'MicroSocks','smartdns':'SmartDNS',
            'adguardhome':'AdGuard Home','aliddns':'阿里云DDNS','ddnsto':'DDNSTO',
            'aldriver':'阿里云盘WebDAV','frp':'Frp内网穿透','aria2':'Aria2下载',
            'transmission':'Transmission','minidlna':'MiniDLNA','firefly':'Firefly DLNA',
            'xupnpd':'XUPnPD','vsftpd':'FTP服务器','dump1090':'ADS-B接收','msd_lite':'组播转单播',
            'vlmcsd':'KMS激活','mentohust':'锐捷认证','u2ec':'U2EC','scutclient':'SCUT认证',
            'dogcom':'校园网认证','gdut_drcom':'校园网认证','minieap':'校园网认证',
            'srelay':'SOCKS代理','chinadns_ng':'ChinaDNS-NG','dns2tcp':'DNS over TCP',
            'dnsproxy':'DNS代理','ipt2socks':'iptables转socks',
            'microsocks':'MicroSocks','3proxy':'3Proxy代理',
            'dnsforwarder':'DNS转发器','xupnpd':'XUPnPD媒体服务器',
            'wireguard':'WireGuard工具(wg)','zerotier':'ZeroTier',
            'aria2':'Aria2下载','transmission':'Transmission下载',
            'minidlna':'MiniDLNA媒体服务器','firefly':'Firefly媒体服务器',
            'inadyn':'动态域名','dnsmasq':'DNS/DHCP服务器',
            'lldt':'LLTD网络发现','resolveip':'IP解析工具',
          }
          index = []
          for line in open('/tmp/plugin_map.txt', encoding='utf-8'):
            line=line.strip()
            if not line or '|' not in line: continue
            name, paths = line.split('|',1)
            paths = paths.split()
            found=[]
            for pat in paths:
              for dp,_,fs in os.walk(romfs):
                for f in fs:
                  full=os.path.join(dp,f)
                  rel=os.path.relpath(full,romfs)
                  if fnmatch.fnmatch(rel,pat) or fnmatch.fnmatch(f,os.path.basename(pat)):
                    if full not in found: found.append(full)
            if not found:
              print('SKIP (not found):', name, paths); continue
            # create package dir mirroring romfs paths
            tmpd=os.path.join('/tmp','pk_'+name)
            os.makedirs(tmpd,exist_ok=True)
            manifest={'name':name,'title':fancy.get(name,name),'arch':'mipsel-linux-musl','files':[]}
            for full in found:
              rel=os.path.relpath(full,romfs)
              dst=os.path.join(tmpd,rel)
              os.makedirs(os.path.dirname(dst),exist_ok=True)
              import shutil; shutil.copy2(full,dst)
              manifest['files'].append(rel)
            mpath=os.path.join(tmpd,'manifest.json')
            with open(mpath,'w',encoding='utf-8') as f: json.dump(manifest,f,ensure_ascii=False)
            out=os.path.join(pkgdir,name+'.tar.gz')
            with tarfile.open(out,'w:gz') as tf:
              for dp,_,fs in os.walk(tmpd):
                for f in fs:
                  full=os.path.join(dp,f)
                  tf.add(full, os.path.relpath(full,tmpd))
            sha=hashlib.sha256(open(out,'rb').read()).hexdigest()
            index.append({'name':name,'title':fancy.get(name,name),'file':name+'.tar.gz',
                          'size':os.path.getsize(out),'sha256':sha,'files':manifest['files']})
            print('PACKED',name,os.path.getsize(out),'bytes',len(manifest['files']),'files')
          with open(os.path.join(pkgdir,'plugins.json'),'w',encoding='utf-8') as f:
            json.dump({'arch':'mipsel-linux-musl','build':os.environ.get('BUILD_DATE',''),'plugins':index},f,ensure_ascii=False,indent=2)
          # TSV index consumed by the router-side pluginctl (pure awk, no jq/python)
          with open(os.path.join(pkgdir,'plugins.txt'),'w',encoding='utf-8') as f:
            # No comment line: router-side pluginctl treats every NF>=4 line as a plugin.
            for it in index:
                f.write('%s|%s|%s|%s|%s\n' % (it['name'],it['title'],it['file'],it['size'],it['sha256']))
          print('TOTAL plugins:',len(index))
          PY
          ls -lh "$PKGDIR" | head -60

      - name: Augment plugin packages with required helper files
        working-directory: src
        run: |
          python3 - <<'PY'
          import os, json, hashlib, tarfile, shutil
          root=os.getcwd(); romfs=os.path.join(root,'trunk','romfs'); pkgdir=os.path.join(root,'plugin-repo')
          # Extra files to append into specific plugin packages, copied from romfs.
          # key: plugin name -> list of (romfs_relative_path_or_glob, dest_arcname)
          extras = {
            '3proxy': [('usr/lib/TransparentPlugin.ld.so','usr/lib/TransparentPlugin.ld.so')],
            'firefly': [
              ('usr/lib/firefly/plugins/out-daap.so','usr/lib/firefly/plugins/out-daap.so'),
              ('usr/lib/firefly/plugins/rsp.so','usr/lib/firefly/plugins/rsp.so'),
              ('usr/lib/firefly/plugins/ssc-ffmpeg.so','usr/lib/firefly/plugins/ssc-ffmpeg.so'),
            ],
          }
          def find_one(rel):
            p=os.path.join(romfs,rel)
            if os.path.isfile(p): return p
            base=os.path.basename(rel)
            for dp,_,fs in os.walk(romfs):
              for f in fs:
                if f==base: return os.path.join(dp,f)
            return None
          def sha(p): return hashlib.sha256(open(p,'rb').read()).hexdigest()
          # Load index
          jf=os.path.join(pkgdir,'plugins.json')
          data=json.load(open(jf,encoding='utf-8')) if os.path.isfile(jf) else {'plugins':[]}
          byname={p['name']:p for p in data['plugins']}
          tf_by_name={p['name']:p['file'] for p in data['plugins']}
          for name,items in extras.items():
            tarpath=os.path.join(pkgdir, tf_by_name.get(name,name+'.tar.gz'))
            if not os.path.isfile(tarpath):
              print('AUGMENT SKIP (no package):',name); continue
            tmpd=os.path.join('/tmp','aug_'+name)
            if os.path.isdir(tmpd): shutil.rmtree(tmpd)
            os.makedirs(tmpd,exist_ok=True)
            with tarfile.open(tarpath,'r:gz') as tf: tf.extractall(tmpd)
            added=0
            for rel,arc in items:
              src=find_one(rel)
              if not src:
                print('  missing extra:',name,rel); continue
              dst=os.path.join(tmpd,arc); os.makedirs(os.path.dirname(dst),exist_ok=True)
              shutil.copy2(src,dst); added+=1
            if added:
              with tarfile.open(tarpath,'w:gz') as tf:
                for dp,_,fs in os.walk(tmpd):
                  for f in fs:
                    full=os.path.join(dp,f); tf.add(full,os.path.relpath(full,tmpd))
              # refresh index entry size/sha/files
              e=byname.get(name)
              if e:
                e['size']=os.path.getsize(tarpath); e['sha256']=sha(tarpath)
                e['files']=[m.name for m in tarfile.open(tarpath,'r:gz').getmembers() if m.isfile() and m.name!='manifest.json']
              print('AUGMENTED',name,'with',added,'files')
          # rewrite indexes from current data
          with open(jf,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2)
          with open(os.path.join(pkgdir,'plugins.txt'),'w',encoding='utf-8') as f:
            for p in data['plugins']:
              f.write('%s|%s|%s|%s|%s\n'%(p['name'],p['title'],p['file'],p['size'],p['sha256']))
          print('index refreshed; total',len(data['plugins']))
          PY

      - name: Build nanoad and adbyby plugin packages
        working-directory: src
        run: |
          python3 build_extra_plugins.py
          echo "=== final plugin index ==="
          wc -l plugin-repo/plugins.txt
          tail -5 plugin-repo/plugins.txt

      - name: Inject plugin admin page (webui.conf + start/stop) into every package
        working-directory: src
        run: |
          # Every plugin package gets a webui.conf (settings form rendered by the firmware
          # generic admin page Advanced_plugincfg.asp) plus start.sh/stop.sh, so an installed
          # plugin always has a working config page in the Web UI.
          BASE=https://raw.githubusercontent.com/jonepjxh/padavan-TurBoTse/main/plugin-build
          # cache-buster: raw.githubusercontent CDN caches aggressively; force fresh payload
          CB="v=$RANDOM$RANDOM"
          curl -fL --retry 3 -o /tmp/plugin-webui.tar.gz "$BASE/plugin-webui.tar.gz?$CB"
          curl -fL --retry 3 -o /tmp/inject.py "$BASE/inject.py?$CB"
          rm -rf /tmp/plugui-webui && mkdir -p /tmp/plugui-webui
          tar -xzf /tmp/plugin-webui.tar.gz -C /tmp/plugui-webui
          echo "payload packages: $(ls /tmp/plugui-webui | wc -l)"
          WEBUI_ROOT=/tmp/plugui-webui INJECT_TMP=/tmp python3 /tmp/inject.py
          echo "=== index after injection (head) ==="
          head -5 plugin-repo/plugins.txt
          echo "=== spot check package contents ==="
          for pk in smartdns zerotier dns2tcp htop nanoad; do
            echo "--- $pk ---"
            tar -tzf "plugin-repo/$pk.tar.gz" | tr '\n' ' '
            echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-repo-${{ env.BUILD_DATE }}
          path: src/plugin-repo/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish plugin repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-repo
          name: K2P 插件仓库 (plugin-repo)
          body: |
            独立插件包仓库，供固件「高级设置 → 插件管理」在线下载安装。
            架构：mipsel-linux-musl。每个 .tar.gz 内含二进制 + manifest.json。
            plugins.txt 为固件读取的 TSV 索引，plugins.json 为完整索引。
            批量打包全部纯用户态插件（含 NanoAd 无密码版与 Adbyby），不含依赖内核模块的插件。动态链接插件依赖固件 /lib 中的 musl 运行库。
          files: src/plugin-repo/*
