name: build-plugins

# 交叉编译 mipsel-linux-musl 插件包，发布到 plugin-repo release，并刷新 plugins.txt
on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          corepack enable || true
          npm i -g pnpm@10 || true
          pnpm --version

      - name: Install upx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl

      - name: Build & publish plugins
        env:
          PUB: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: plugin-repo
        run: bash plugins/build-plugins.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: plugins/.out/*.tar.gz
          if-no-files-found: warn
