# NanoAd main configuration. Keys use strict key=value syntax.
# Master switch: 0 stops DNS and SNI filtering and restores router DNS.
filter_enabled=1
dns_enabled=1
dns_listen=127.0.0.1
dns_port=5353
dns_upstreams=223.5.5.5:53,119.29.29.29:53
dns_response=nxdomain

# HTTPS SNI filtering is optional. No CA certificate is installed.
sni_enabled=0
sni_listen=0.0.0.0
sni_port=18443
sni_max_connections=256
sni_bind_iface=auto
sni_block_quic=0

web_enabled=1
web_listen=0.0.0.0
web_port=18080
web_user=admin
web_token=admin
web_root=/etc/storage/nanoad/web

# Daily update at 04:23 when auto_update=1.
auto_update=0
# Set to 1 only if the firmware wget/curl lacks a usable CA bundle.
download_insecure=0
